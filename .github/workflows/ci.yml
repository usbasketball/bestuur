name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # contract.json / contract.d.ts are gitignored and imported by the tests,
      # so generate them before typechecking/testing.
      - name: Generate Prisma contract artifacts
        run: npm run contract:emit

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test