name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # contract.json / contract.d.ts are gitignored and imported by the tests,
      # so generate them before typechecking/testing.
      - name: Generate Prisma contract artifacts
        run: npm run contract:emit

      # lib/graphql/generated is gitignored and imported by the pages, so
      # regenerate it (schema + client types) before typechecking/testing.
      - name: Generate GraphQL schema and client types
        run: npm run schema:generate && npm run codegen

      # LayoutProps etc. live in .next/types, which is gitignored and normally
      # produced by `next dev`/`next build`. Generate them so `tsc` passes on a
      # fresh clone without a full build.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test